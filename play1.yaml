-
  name: first_playbook
  hosts: localhost

  tasks:
    - include_vars: vars.txt
    - name: hello world
      command: echo "hello world"

    - name: date
      command: date

    - name: display contents
      command : ls -lrt chdir=/etc

    - name: add contents to file
      lineinfile:
        path: file.txt
        line: 167.56.898.56
      register: var

    - name: add contents to file
      lineinfile:
        path: file.txt
        line: '{{ servername }}'

    - name: run on condition
      command: echo "running due to lineinfile"
      when: var.changed == true



